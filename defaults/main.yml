---
# defaults file for ansible-role-cvmfs
#
cvmfs_http_proxy: "DIRECT"
cvmfs_quota_limit: "20480"
# /etc/cvmfs/default.conf sets this as "/var/lib/cvmfs"
# cvmfs_cache_dir: "/tmp/cvmfs"

# This repo is used to test cvmfs after the playbook
cvmfs_test_repo: "cvmfs-config.cern.ch"

# cms_site: ""
#
# Set cvmfs_overwrite_default_local to False to not overwrite default.local
cvmfs_overwrite_default_local: true

# If the GPG key is located locally, override the default here
cvmfs_yum_repokey: "https://cvmrepo.web.cern.ch/cvmrepo/yum/RPM-GPG-KEY-CernVM-2048"

cvmfs_rpm_use_cvmfs_release: true
# if above is set to false, also set
# cvmfs_repo_custom_location: to a correct location
#

cvmfs_deb_dependencies:
 - attr
 - gdb
 - libc6-dev
 - uuid-dev
 - uuid

cvmfs_deb_url: "https://ecsft.cern.ch/dist/cvmfs/cvmfs-2.13.3/cvmfs_2.13.3+ubuntu25.10_amd64.deb"
cvmfs_deb_config_url: "https://ecsft.cern.ch/dist/cvmfs/cvmfs-config/cvmfs-config-default_latest_all.deb"
